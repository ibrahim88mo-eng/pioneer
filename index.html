<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>برنامج الحسابات</title>
<style>
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:Tahoma,Cairo,Arial,sans-serif;background:#f5f7fa;color:#14283c}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#fff;border-bottom:3px double #b08d3c;flex-wrap:wrap}
header img{height:64px}
h1{margin:0;font-size:24px}
.sp{flex:1}
button,.btn{font:inherit;font-size:14px;padding:7px 14px;border:1px solid #2f4a66;background:#2f4a66;color:#fff;border-radius:5px;cursor:pointer}
button.l,.btn.l{background:#fff;color:#2f4a66}
nav{display:flex;gap:4px;padding:10px 20px 0;flex-wrap:wrap}
nav button{background:#d6e4f0;color:#14283c;border:0;border-radius:6px 6px 0 0}
nav button.on{background:#2f4a66;color:#fff}
main{padding:14px 20px}
.form{display:flex;flex-wrap:wrap;gap:10px;background:#fff;padding:12px;border:1px solid #c9d1db;border-top:4px solid #b08d3c;border-radius:4px;margin-bottom:12px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:13px;gap:3px}
input{font:inherit;padding:6px;border:1px solid #c9d1db;border-radius:4px;min-width:110px}
table{width:100%;border-collapse:collapse;background:#fff;margin-bottom:12px}
th{background:#2f4a66;color:#fff;padding:8px;font-size:14px}
td{padding:7px 8px;border-bottom:1px solid #e3e7ec;text-align:center;font-size:14px}
tr:nth-child(even) td{background:#f7f9fb}
tr.s td{background:#d6e4f0;font-weight:bold}
.tot{margin:10px 0;font-weight:bold;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:#fff;border:1px solid #c9d1db;border-top:4px solid #b08d3c;border-radius:4px;padding:10px}
.card li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #eef1f4}
.card ul{list-style:none;margin:0 0 8px;padding:0}
h3{margin:14px 0 6px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.sum div{background:#fff;border:1px solid #c9d1db;border-top:4px solid #b08d3c;border-radius:4px;padding:10px;font-size:14px}
.sum b{display:block;font-size:22px;margin-top:4px}
.sum .big{background:#d6e4f0;border-top-color:#2f4a66}
.sum .big b{font-size:28px}
.neg{color:#b00020}.pos{color:#1b6b3a}
.note{font-size:13px;color:#4f5b69;margin:6px 0}
@media print{header button,header .btn,nav,.form,.act{display:none}}
</style>
</head>

<script>
const KEY='accounts_v1',$=s=>document.querySelector(s);
const def=()=>({company:'الرائد للإنشاءات والمقاولات العامة',lists:{projects:['B-1','B-2','عام الشركة'],items:['مواد','عمالة','مقاولين من الباطن','معدات ونقل','مرتبات','مصروفات إدارية','أخرى'],parties:[],employees:[]},data:{},seq:1});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const N=v=>parseFloat(String(v||0).replace(/,/g,''))||0;
const fmt=v=>typeof v==='number'?v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):(v??'');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=t=>String(t||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064b-\u0652ـ]/g,'');
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const D=k=>S.data[k]||(S.data[k]=[]);

const T=[
{k:'treasury',t:'الخزينة',order:'d',f:[['d','التاريخ','date'],['descr','البيان','text'],['project','المشروع','projects'],['item','البند','items'],['party','الجهة (مقاول/مورد)','parties'],['inflow','وارد','num'],['outflow','منصرف','num']],
 x:[['_bal','الرصيد',1]],calc:r=>{let b=0;r.forEach(x=>{b+=x.inflow-x.outflow;x._bal=b})},chk:r=>!(r.inflow||r.outflow)&&'اكتب مبلغ في وارد أو منصرف',

{k:'invoices',t:'المستخلصات',order:'d',f:[['d','التاريخ','date'],['party','المقاول','parties'],['project','المشروع','projects'],['descr','رقم / وصف المستخلص','text'],['amount','القيمة','num']],

{k:'custody',t:'العهد',order:'d',f:[['d','التاريخ','date'],['emp','الموظف','employees'],['project','المشروع','projects'],['received','عهدة مستلمة','num'],['settled','مصروفات مُسوّاة','num'],['descr','البيان','text']],

{k:'cheques',t:'حساب البنك',order:'d',f:[['d','التاريخ','date'],['name','اسم الشيك / الإيداع','text'],['amount','القيمة','num'],['bank','اسم البنك','text']],

{k:'assign',t:'جهة الإسناد',order:'project',f:[['project','المشروع','projects'],['client','جهة الإسناد','text'],['value','قيمة المشروع','num']],

const TABS=[...T.map(c=>[c.k,c.t]),['search','البحث'],['reports','التقارير'],['lists','القوائم']];

function nav(){$('#nav').innerHTML=TABS.map(([k,t])=>`<button class="${k===cur?'on':''}" data-k="${k}">${t}</button>`).join('')}
$('#nav').onclick=e=>{const k=e.target.dataset.k;if(k)show(k)};
function head(){$('#co').textContent=S.company;document.title=S.company+' - برنامج الحسابات'}
function show(k){cur=k;ed=null;nav();const c=T.find(t=>t.k===k);c?dataTab(c):({search:searchTab,reports:reportsTab,lists:listsTab})[k]()}
function reset(c){c.f.forEach(([k,,t])=>{const i=$('#f_'+k);i.value=t==='date'?today():t==='month'?today().slice(0,7):(t==='text'||t==='num'?'':i.value)})}

function dataTab(c){
 const inp=c.f.map(([k,l,t])=>`<label>${l}<input id="f_${k}" ${t==='date'||t==='month'?`type="${t}"`:t==='num'?'inputmode="decimal"':S.lists[t]?`list="dl_${t}"`:''}></label>`).join('');
 const dls=Object.keys(S.lists).map(n=>`<datalist id="dl_${n}">${S.lists[n].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`).join('');
 $('#main').innerHTML=`<div class="form">${inp}<label><span><button id="ok">إضافة</button> <button class="l" id="cx" hidden>إلغاء</button>${c.k==='treasury'?' <button class="l" id="ii">استيراد مصروفات من صورة</button><input type="file" id="if" accept="image/*" multiple hidden>':''}</span></label></div>${dls}<div id="imp"></div><div id="tb"></div>`;
 if(c.k==='treasury'){$('#ii').onclick=()=>$('#if').click();$('#if').onchange=e=>{if(e.target.files.length)importImg(e.target.files);e.target.value=''}}
 reset(c);
 $('#ok').onclick=()=>{
  const o={};
  for(const [k,,t] of c.f){let v=$('#f_'+k).value.trim();if(t==='num')v=N(v);o[k]=v}
  if(!o.d&&c.f[0][0]==='d')return alert('اختر التاريخ');
  const e=c.chk&&c.chk(o);if(e)return alert(e);
  if(ed)Object.assign(D(c.k).find(r=>r.id===ed),o);else{o.id=S.seq++;D(c.k).push(o)}
  ed=null;save();$('#ok').textContent='إضافة';$('#cx').hidden=true;
  c.f.forEach(([k,,t])=>{if(t==='num'||t==='text')$('#f_'+k).value=''});draw(c)};
 $('#cx').onclick=()=>{ed=null;$('#ok').textContent='إضافة';$('#cx').hidden=true;c.f.forEach(([k,,t])=>{if(t==='num'||t==='text')$('#f_'+k).value=''})};
 $('#tb').onclick=e=>{
  const eid=+e.target.dataset.e,did=+e.target.dataset.d;
  if(eid){const r=D(c.k).find(x=>x.id===eid);c.f.forEach(([k,,t])=>$('#f_'+k).value=t==='num'&&!r[k]?'':r[k]);ed=eid;$('#ok').textContent='حفظ التعديل';$('#cx').hidden=false;scrollTo(0,0)}
  if(did&&confirm('حذف السطر نهائيًا؟')){S.data[c.k]=D(c.k).filter(x=>x.id!==did);save();draw(c)}};
 $('#tb').onchange=e=>{const o=e.target.dataset.o;if(o){S.opts=S.opts||{};S.opts[o]=e.target.checked;save();draw(c)}};
 draw(c)}

function draw(c){
 const rows=[...D(c.k)].sort((a,b)=>String(a[c.order]).localeCompare(String(b[c.order]))||a.id-b.id);
 c.calc&&c.calc(rows);
 const cols=[...c.f.map(([k,l,t])=>[k,l,t==='num']),...(c.x||[])];
 $('#tb').innerHTML=(c.k==='cheques'?bankBox():'')+`<table><tr>${cols.map(x=>`<th>${x[1]}</th>`).join('')}<th class="act"></th></tr>${rows.map(r=>`<tr>${cols.map(([k,,n])=>`<td>${n?fmt(r[k]):esc(r[k])}</td>`).join('')}<td class="act"><button class="l" data-e="${r.id}">تعديل</button> <button class="l" data-d="${r.id}">حذف</button></td></tr>`).join('')}</table>`+(c.tot||[]).map(([k,l])=>`<div class="tot">${l}: ${fmt(sum(rows,r=>r[k]))}</div>`).join('')+(c.k==='cheques'?bankStmt():'')}

function bankMoves(){
 const o=S.opts||{},m=[];
 D('cheques').forEach(r=>m.push([r.d,'شيك / إيداع: '+r.name+(r.bank?' - '+r.bank:''),r.amount,0]));
 D('treasury').forEach(r=>{if(r.outflow)m.push([r.d,'مصروف: '+r.descr+(r.party?' - '+r.party:''),0,r.outflow])});
 if(o.pay)D('payroll').forEach(r=>m.push([r.month+'-01','مرتب: '+r.name,0,r.basic+r.allow-r.deduct-r.advance]));
 if(o.cus)D('custody').forEach(r=>{if(r.settled)m.push([r.d,'مصروف عهدة: '+r.emp,0,r.settled])});
 return m.sort((a,b)=>String(a[0]).localeCompare(String(b[0])))}
function bankBox(){
 const m=bankMoves(),dep=sum(m,x=>x[2]),exp=sum(m,x=>x[3]),rem=dep-exp,o=S.opts||{};
 return `<div class="sum"><div>إجمالي الشيكات والإيداعات<b>${fmt(dep)}</b></div><div>إجمالي المصروفات المخصومة<b>${fmt(exp)}</b></div><div class="big">باقي البنك بعد خصم المصروفات<b class="${rem<0?'neg':'pos'}">${fmt(rem)}</b></div></div>
 <div class="note">المصروفات = كل «منصرف» مسجل في الخزينة، وتُخصم تلقائيًا من البنك.</div>
 <div class="note act"><label style="flex-direction:row;gap:6px"><input type="checkbox" data-o="pay" ${o.pay?'checked':''}> احسب مرتبات شيت المرتبات أيضًا</label><label style="flex-direction:row;gap:6px"><input type="checkbox" data-o="cus" ${o.cus?'checked':''}> احسب مصروفات العهد المُسوّاة أيضًا</label>
 <span>(فعّلهما فقط لو لا تسجل هذه المصروفات في الخزينة، حتى لا تُحسب مرتين)</span></div>`}
function bankStmt(){
 let b=0;const rows=bankMoves().map(x=>{b+=x[2]-x[3];return {v:[x[0],x[1],x[2]||'',x[3]||'',b]}});
 return `<h3>كشف حساب البنك التراكمي</h3>`+tbl(['التاريخ','البيان','إيداع / شيك (+)','مصروف (−)','الرصيد المتبقي'],rows)}
const IMPERR={not_granted:'لم تسمح للصفحة باستخدام Claude، فلا يمكن قراءة الصورة.',rate_limited:'محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة.',image_rejected:'الصورة غير مدعومة أو كبيرة جدًا. استخدم صورة JPG أو PNG أقل من 20 ميجا.',refused:'تعذر قراءة هذه الصورة.',invalid_json:'لم أستطع ترتيب النتيجة، أعد المحاولة بصورة أوضح.'};
async function importImg(files){
 let sm=null;try{sm=window.claude?await claude.use('sample'):null}catch(e){}
 if(!sm)return alert('قراءة الصور تعمل فقط من النسخة المنشورة على Claude بعد تسجيل الدخول. افتح الرابط من claude.ai.');
 const lim=await sm.limits().catch(()=>null);
 if(!lim||!lim.images)return alert('قراءة الصور غير متاحة في هذا العرض.');
 const fl=[...files].slice(0,lim.images.maxCount||3);
 $('#imp').innerHTML='<div class="card"><b>جاري قراءة الصورة...</b> قد يستغرق حتى دقيقة، ويطلب منك الإذن أول مرة.</div>';
 const prompt=`الصور المرفقة قائمة مصروفات مكتوبة بخط اليد (بالعربية غالبًا). اقرأها بدقة وأعد فقط JSON: مصفوفة، عنصر لكل بند مصروف، بهذا الشكل:
[{"d":"YYYY-MM-DD أو فارغ إذا لم يُكتب تاريخ","descr":"البيان كما هو مكتوب","party":"اسم الجهة أو الشخص المدفوع له أو فارغ","project":"فقط من هذه القائمة إن كان واضحًا وإلا فارغ: ${S.lists.projects.join('، ')}","item":"فقط من هذه القائمة إن كان واضحًا وإلا فارغ: ${S.lists.items.join('، ')}","outflow":123.5,"uncertain":false}]
قواعد: اكتب الأرقام بالأرقام الإنجليزية، والمبلغ رقم فقط. تجاهل سطور الإجمالي والمجموع. لا تخمّن ولا تخترع: ضع uncertain:true لأي بند أو رقم أو كلمة غير واضحة. إذا كان التاريخ مكتوبًا بدون سنة فاستخدم سنة ${today().slice(0,4)}.`;
 try{
  const out=await sm.json(prompt,{images:fl,cache:false});
  const rows=(Array.isArray(out)?out:[]).map(r=>({d:/^\d{4}-\d{2}-\d{2}$/.test(r.d)?r.d:'',descr:r.descr||'',party:r.party||'',project:r.project||'',item:r.item||'',outflow:N(r.outflow),u:!!r.uncertain}));
  if(!rows.length){$('#imp').innerHTML='';return alert('لم أجد مصروفات في الصورة. جرّب صورة أوضح.')}
  impReview(rows)
 }catch(e){$('#imp').innerHTML='';alert(IMPERR[e.code]||'تعذر قراءة الصورة، حاول مرة أخرى.')}}
function impReview(rows){
 const inp=(c,v,w)=>`<input class="${c}" value="${esc(v)}" style="min-width:${w||90}px;width:100%">`;
 $('#imp').innerHTML=`<div class="card" style="margin-bottom:12px"><h3 style="margin-top:0">راجع المصروفات قبل التسجيل</h3>
 <div class="note">الصفوف الصفراء = غير واضحة في الصورة، راجعها. عدّل أي خانة، وأزل العلامة من أي سطر لا تريده. التاريخ أو المشروع الفارغ يأخذ القيمة الافتراضية.</div>
 <div class="form"><label>تاريخ افتراضي<input type="date" id="i_d" value="${today()}"></label><label>مشروع افتراضي<input id="i_p" list="dl_projects"></label></div>
 <div style="overflow-x:auto"><table><tr><th></th><th>التاريخ</th><th>البيان</th><th>المشروع</th><th>البند</th><th>الجهة</th><th>المبلغ</th></tr>${rows.map((r,i)=>`<tr data-i="${i}" style="${r.u?'background:#fff3b0':''}"><td><input type="checkbox" class="on" checked style="min-width:0"></td><td><input type="date" class="d" value="${r.d}"></td><td>${inp('ds',r.descr,180)}</td><td>${inp('pj',r.project)}</td><td>${inp('it',r.item)}</td><td>${inp('pt',r.party)}</td><td>${inp('am',r.outflow||'',80)}</td></tr>`).join('')}</table></div>
 <button id="i_ok">تسجيل المحدد في الخزينة</button> <button class="l" id="i_no">إلغاء</button></div>`;
 $('#i_no').onclick=()=>$('#imp').innerHTML='';
 $('#i_ok').onclick=()=>{
  const dd=$('#i_d').value||today(),dp=$('#i_p').value.trim();let n=0;
  document.querySelectorAll('#imp tr[data-i]').forEach(tr=>{const g=c=>tr.querySelector('.'+c),am=N(g('am').value);
   if(!g('on').checked||!am)return;
   D('treasury').push({id:S.seq++,d:g('d').value||dd,descr:g('ds').value.trim(),project:g('pj').value.trim()||dp,item:g('it').value.trim(),party:g('pt').value.trim(),inflow:0,outflow:am});n++});
  if(!n)return alert('لا توجد مصروفات محددة بمبلغ صحيح');
  save();alert('تم تسجيل '+n+' مصروف في الخزينة');show('treasury')}}
function tbl(h,rows){return `<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr class="${r.s?'s':''}">${r.v.map(x=>`<td>${typeof x==='number'?fmt(x):esc(x)}</td>`).join('')}</tr>`).join('')}</table>`}

function searchTab(){
 $('#main').innerHTML=`<div class="form"><label>ابحث في كل الأقسام (اسم، بيان، مشروع، مبلغ، تاريخ)<input id="q" style="min-width:380px"></label></div><div id="res"></div>`;
 const run=()=>{
  const q=norm($('#q').value).trim(),out=[];
  if(q)T.forEach(c=>D(c.k).forEach(r=>{
   const txt=c.f.filter(f=>f[2]!=='num').map(f=>r[f[0]]).join(' - '),amt=c.f.filter(f=>f[2]==='num').map(f=>r[f[0]]).filter(Boolean);
   const hay=norm(txt+' '+amt.map(a=>a+' '+fmt(a)).join(' '));
   if(hay.includes(q))out.push({v:[c.t,r.d||r.month||'',txt,amt[0]||0]})}));
  $('#res').innerHTML=`<div class="tot">عدد النتائج: ${out.length}</div>`+(out.length?tbl(['القسم','التاريخ','التفاصيل','المبلغ'],out):'')};
 $('#q').oninput=run;$('#q').focus()}

function reportsTab(){
 const inv={},paid={};
 D('invoices').forEach(r=>inv[r.party]=(inv[r.party]||0)+r.amount);
 D('treasury').forEach(r=>{if(r.party)paid[r.party]=(paid[r.party]||0)+r.outflow});
 const ps=[...new Set([...Object.keys(inv),...Object.keys(paid)])].sort();
 const con=ps.map(p=>({v:[p,inv[p]||0,paid[p]||0,(inv[p]||0)-(paid[p]||0)]}));
 const tr=D('treasury'),pj=[...new Set([...S.lists.projects,...tr.map(r=>r.project).filter(Boolean)])],it=[...new Set([...S.lists.items,...tr.map(r=>r.item).filter(Boolean)])];
 const piv=it.map(i=>{const v=pj.map(p=>sum(tr.filter(r=>r.item===i&&r.project===p),r=>r.outflow));return {v:[i,...v,sum(v,x=>x)]}});
 const out=pj.map((p,j)=>sum(piv,r=>r.v[j+1])),inn=pj.map(p=>sum(tr.filter(r=>r.project===p),r=>r.inflow));
 piv.push({s:1,v:['إجمالي المصروفات',...out,sum(out,x=>x)]},{s:1,v:['إجمالي الوارد',...inn,sum(inn,x=>x)]},{s:1,v:['الصافي (وارد - منصرف)',...inn.map((x,j)=>x-out[j]),sum(inn,x=>x)-sum(out,x=>x)]});
 const asg=D('assign').map(a=>{const sp=sum(tr.filter(r=>r.project===a.project),r=>r.outflow);return {v:[a.project,a.client,a.value,sp,a.value-sp]}});
 const em=[...new Set(D('custody').map(r=>r.emp))].sort(),cu=em.map(e=>{const a=sum(D('custody').filter(r=>r.emp===e),r=>r.received),b=sum(D('custody').filter(r=>r.emp===e),r=>r.settled);return {v:[e,a,b,a-b]}});
 const bk=[...new Set(D('cheques').map(r=>r.bank))].sort().map(b=>({v:[b||'-',sum(D('cheques').filter(r=>r.bank===b),r=>r.amount)]}));
 $('#main').innerHTML=`<h3>كشف المقاولين والموردين</h3>${tbl(['المقاول / المورد','إجمالي المستخلصات','المدفوع','المتبقي'],con)}<h3>مصروفات المشاريع حسب البند</h3>${tbl(['البند',...pj,'الإجمالي'],piv)}<h3>المشاريع وجهات الإسناد</h3>${tbl(['المشروع','جهة الإسناد','قيمة المشروع','المصروفات','المتبقي من قيمة المشروع'],asg)}<h3>أرصدة العهد</h3>${tbl(['الموظف','عهدة مستلمة','مصروفات مُسوّاة','المتبقي في العهدة'],cu)}<h3>الشيكات حسب البنك</h3>${tbl(['البنك','إجمالي الشيكات'],bk)}<h3>رصيد البنك</h3>${bankBox().replace(/<div class="note act">[\s\S]*$/,'')}`}

function listsTab(){
 const nm={projects:'المشاريع',items:'بنود المصروفات',parties:'المقاولون / الموردون',employees:'الموظفون'};
 $('#main').innerHTML=`<p>أسماء هذه القوائم تظهر كاقتراحات أثناء الكتابة في باقي الشاشات. حذف اسم من القائمة لا يمسح الحركات القديمة.</p><div class="grid">${Object.keys(nm).map(k=>`<div class="card"><b>${nm[k]}</b><ul>${S.lists[k].map((x,i)=>`<li>${esc(x)}<button class="l" data-k="${k}" data-i="${i}">حذف</button></li>`).join('')}</ul><label><input id="n_${k}" placeholder="اسم جديد"></label><br><button data-add="${k}">إضافة</button></div>`).join('')}</div>`;
 $('#main').onclick=e=>{const d=e.target.dataset;
  if(d.add){const v=$('#n_'+d.add).value.trim();if(v&&!S.lists[d.add].includes(v)){S.lists[d.add].push(v);save();listsTab()}}
  else if(d.i!==undefined){S.lists[d.k].splice(+d.i,1);save();listsTab()}}}

$('#ren').onclick=()=>{const v=prompt('اسم الشركة:',S.company);if(v&&v.trim()){S.company=v.trim();save();head()}};
$('#exp').onclick=async()=>{const name='accounts-backup-'+today()+'.json',data=JSON.stringify(S);let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:name,data})}catch(e){}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click()};
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.lists||!o.data)throw 0;if(confirm('سيتم استبدال كل البيانات الحالية بالنسخة المختارة. متأكد؟')){S=o;save();head();show('treasury')}}catch(x){alert('الملف غير صالح')}};r.readAsText(f)};
head();show('treasury');
</script>
</body>
</html>
